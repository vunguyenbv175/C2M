name: firmware-evidence
# Firmware-evidence verification — explicit/manual only, FAIL-CLOSED.
# No `|| echo` on mandatory steps: missing artifact / SHA mismatch /
# extraction failure / generator failure / drift all return nonzero (RED).
#
# Original vendor TARs are NOT in the repo (public). Supply them deliberately:
# place both TARs under firmware/original/ on the runner before dispatch.
#   firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar
#   firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require TARs (missing -> RED)
        run: |
          test -f firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar
          test -f firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          pip install msgpack
      - name: Verify evidence chain (fail-closed)
        run: |
          python3 tools/ci/verify_evidence.py \
            --en-tar firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar \
            --vi-tar firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar \
            --workdir /tmp/evid_work --out-dir /tmp/evid_out \
            --canonical-dir docs/reverse
