          # No M4 smuggled into the image (health.sh is the only allowed extra).
          for banned in ("m4_authorize", "m4_adb", "m4_sniff"):
              if (deployed / banned).exists():
                  raise SystemExit(f"D5-VI-GATE: banned service {banned} present")
          # On-demand only: the boot hook launches idle/D3/D4/debug, never health.sh.
          hook = Path("work/tree/wifi/rcInsDriver.sh").read_text()
          assert "health.sh" not in hook, "health.sh must never be boot-launched"
          for item in json.loads(Path("work/audio_map.json").read_text()):
              if Path(item["file"]).read_bytes() != (Path("work/tree") / item["path"].lstrip("/")).read_bytes():
                  raise SystemExit("D5-VI-GATE: VI audio install mismatch")
          hook = Path("work/tree/wifi/rcInsDriver.sh").read_text()
          launches = ["/customer/c2m/c2m-idle >/dev/null 2>&1 &",
                      "/bin/sh /customer/c2m/boot.sh >/dev/null 2>&1 &",
                      "/bin/sh /customer/c2m/d4_boot.sh >/dev/null 2>&1 &",
                      "/bin/sh /customer/c2m/debug_boot.sh >/dev/null 2>&1 &"]
          if any(hook.count(line) != 1 for line in launches) or not (
                  hook.index(launches[0]) < hook.index(launches[1]) < hook.index(launches[2]) < hook.index(launches[3])):
              raise SystemExit("D5-VI-GATE: separate detached idle/D3/D4/debug launch order mismatch")
          report = json.loads(Path("work/mutation_D5_VI.json").read_text())
          database = json.loads(Path("work/d4_database.json").read_text())
          owner = json.loads(Path("work/debug_owner.json").read_text())
          if report.get("d4_services") is not True or report.get("d4_database") != database:
              raise SystemExit("D5-VI-GATE: mutation database hash/count mismatch")
          if report.get("debug_services") is not True:
              raise SystemExit("D5-VI-GATE: mutation debug services flag mismatch")
          if report.get("debug_owner_key_sha256") != owner["sha256"]:
              raise SystemExit("D5-VI-GATE: mutation owner key hash mismatch")
          if report.get("d5_health") is not True:
              raise SystemExit("D5-VI-GATE: mutation d5_health flag mismatch")
          want_health = hashlib.sha256(Path("fw/d5/health.sh").read_bytes()).hexdigest()
          got_health = next(r["sha256"] for r in report["added"] if r["path"] == "/c2m/health.sh")
          if got_health != want_health:
              raise SystemExit("D5-VI-GATE: mutation health.sh provenance hash mismatch")
          # The report carries only the owner key SHA256, never key bytes.
          report_text = Path("work/mutation_D5_VI.json").read_text()
          if "ssh-ed25519" in report_text or "BEGIN" in report_text or "PRIVATE" in report_text:
              raise SystemExit("D5-VI-GATE: mutation report must not carry key material")
          print("D5-VI-GATE: exact installed VI C/D/D3/D4/health/lifetime-debug assets and separate launch order verified")
          EOF
          # Installed health.sh parses under the exact VI stock shell too.
          "$PWD/work/stock-sh" -n work/tree/c2m/health.sh
          sha256sum tools/fw/test_d5_health.py fw/d5/health.sh \
            tools/fw/test_ram_d4_stock_qemu.py tools/fw/mutate_customer.py \
            tools/fw/apply_tree_ownership.py tools/fw/ubifs_manifest.py tools/fw/rebuild_customer.sh \
            tools/fw/verify_b_manifest.py tools/fw/restore_vi_base.py \
            tests/test_tree_ownership.py tests/test_d4_stock_paths.py tests/test_d3_vi_paths.py \
            .github/workflows/firmware-candidateD5-vi.yml > work/d5_test_source.sha256
          cat work/d5_test_source.sha256
          sudo bash tools/fw/rebuild_customer.sh --mode mutated \
            --tree work/tree --tree-report work/tree_report.json \
            --geometry work/customer_geometry.json \
            --stock-manifest work/customer_manifest.json \
            --mut-manifest work/mutation_D5_VI.json \
            --out work/customer_D5_VI.es --report work/rebuild_D5_VI.json
      - name: P3 assemble + deep validate + allowlist diff Candidate D5_VI (generic packtool B names; GATE)
        run: |
          # Other agent provides --base-tar alias + --base-profile {en,vi}.
          # VI base: --base-tar <VI tar> --contract work/VI_PACKAGE_CONTRACT.json --base-profile vi.
          # Generic EN filenames from the packtool are kept; the release README
          # renames them explicitly (VI-A / D5-VI in THIS deliverable).
          python3 tools/fw/build_candidates.py \
            --base-tar firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar \
            --contract work/VI_PACKAGE_CONTRACT.json --base-profile vi \
            --workdir work/candidates --customer-b work/customer_D5_VI.es
          python3 - <<'EOF'
          import json
          from pathlib import Path
          for filename, expected in (("validate_A_deep.json", "VALID"),
                                     ("validate_B_deep.json", "VALID"),
                                     ("candidate_B_diff.json", "ALLOWLIST-OK")):
              verdict = json.loads((Path("work/candidates") / filename).read_text())["verdict"]
              if verdict != expected:
                  raise SystemExit(f"D5-VI-GATE: {filename}: {verdict} != {expected}")
          print("D5-VI-GATE: both deep validations VALID (VI profile); protected-payload diff ALLOWLIST-OK")
          EOF
          sha256sum work/candidates/EN_ENHANCE_IDLE.tar work/candidates/EN_REPACK_GOLDEN.tar \
            > work/candidateD5_vi_hashes.txt
      - name: Assemble private release layout (VI-A + D5_VI; stock VI token; NOT FLASH-READY)
        run: |
          R=release/c2m-flash
          mkdir -p "$R/C2M_FLASH_A" "$R/C2M_FLASH_D5_VI" "$R/BUILD_EVIDENCE"
          cp work/candidates/EN_REPACK_GOLDEN.tar work/candidates/EN_ENHANCE_IDLE.tar "$R/"
          tar -C "$R/C2M_FLASH_A" -xf "$R/EN_REPACK_GOLDEN.tar"
          tar -C "$R/C2M_FLASH_D5_VI" -xf "$R/EN_ENHANCE_IDLE.tar"
          test "$(ls "$R/C2M_FLASH_A" | sort | tr '\n' ' ')" = "SigmastarUpgradeSD_SSC8838G.bin adas_upgrade.sh minieye_firmware.md5 sysVer.txt "
          test "$(ls "$R/C2M_FLASH_D5_VI" | sort | tr '\n' ' ')" = "SigmastarUpgradeSD_SSC8838G.bin adas_upgrade.sh minieye_firmware.md5 sysVer.txt "
          python3 - <<'EOF'
          from pathlib import Path
          import tarfile
          with tarfile.open("firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar") as package:
              stock_token = package.extractfile("sysVer.txt").read()
          assert stock_token == b"sysVer 20230920185743\nend\n", stock_token
          members = {"SigmastarUpgradeSD_SSC8838G.bin", "adas_upgrade.sh", "minieye_firmware.md5", "sysVer.txt"}
          for folder in ("C2M_FLASH_A", "C2M_FLASH_D5_VI"):
              directory = Path("release/c2m-flash") / folder
              if {p.name for p in directory.iterdir()} != members or any(
                      p.is_symlink() or not p.is_file() for p in directory.iterdir()):
                  raise SystemExit("D5-VI-GATE: release must contain exactly four regular files")
              if (directory / "sysVer.txt").read_bytes() != stock_token:
                  raise SystemExit("D5-VI-GATE: CI release must retain the exact stock VI token")
          print("D5-VI-GATE: exact four-file VI-A/D5_VI folders; stock VI token bytes unchanged")
          EOF
          cp work/candidateD5_vi_hashes.txt work/c2m_idle.sha256 work/qemu_bin.sha256 \
            work/qemu_out.txt work/mutation_D5_VI.json work/audio_map.json work/tool_versions.txt \
            work/vi_audio_SHA256SUMS.txt work/tsr_experiment_tests.txt \
            work/tsr_stock_busybox_tests.txt work/tsr_profile_boot.sh work/tsr_profile_boot.sha256 \
            work/d3_build_tests.txt work/d3_services.sha256 work/d3_source.sha256 \
            work/d3_test_source.sha256 work/d3_supplicant_source.json \
            work/d3_boot.sh work/d3_connectivity_probe.sh work/d3_build.sh \
            work/d4_build_tests.txt work/d4_services.sha256 work/d4_source.sha256 \
            work/d4_test_source.sha256 work/d4_database.json work/d4_report.json \
            work/d4_boot.sh work/d4_build.sh work/d5_gps_runtime.json \
            work/d5_health_tests.txt \
            work/debug_build_tests.txt work/debug_services.sha256 work/debug_source.sha256 \
            work/debug_test_source.sha256 work/debug_report.json work/debug_edition.txt \
            work/debug_help_lifetime.txt \
            work/debug_boot.sh work/debug_build.sh work/d4_database.json work/debug_owner.json \
            "$R/BUILD_EVIDENCE/"
          # D5 health source is public-safe plain source; keep a copy with evidence.
          cp fw/d5/health.sh "$R/BUILD_EVIDENCE/d5_health.sh"
          sha256sum fw/d5/health.sh > "$R/BUILD_EVIDENCE/d5_health.sha256"
          mkdir -p "$R/OPEN_SOURCE"
          cp work/d3-upstream/wpa_supplicant-2.12.tar.gz work/d3-upstream/libnl-3.11.0.tar.gz \
            work/d3-services/wpa_supplicant.COPYING fw/d3/build_supplicant.sh fw/d3/compat.h \
            fw/device_minimal/start.S fw/d3/init_arrays.c "$R/OPEN_SOURCE/"
          # Preserve the same exact sources, recipe and relinkable LGPL libnl
          # objects. Private deliverable only, never public binary artifacts.
          tar -C work/d3-upstream -czf "$R/OPEN_SOURCE/supplicant-relink.tar.gz" \
            wpa_supplicant-2.12 libnl-3.11.0 nl start.S start.o init_arrays.o compat_prefix.h pkg-config-static
          # Debug open source: pinned Dropbear tarball, license, source pin and
          # own build/supervisor/boot sources (already public). Never keys.
          cp work/dropbear-upstream/dropbear-2026.94.tar.bz2 "$R/OPEN_SOURCE/"
          for f in work/debug-build/dropbear.LICENSE work/debug-build/dropbear.COPYING \
            work/debug-build/dropbear.README; do
            if [ -f "$f" ]; then cp "$f" "$R/OPEN_SOURCE/"; fi
          done
          test -f "$R/OPEN_SOURCE/dropbear.LICENSE" || test -f "$R/OPEN_SOURCE/dropbear.COPYING"
          cp work/debug-build/dropbear_SOURCE.json fw/debug/build_dropbear.sh \
            fw/debug/supervisor.h fw/debug/supervisor.c fw/debug/debug_boot.sh \
            tools/fw/patch_debug_dropbear.py "$R/OPEN_SOURCE/"
          cp work/customer_geometry.json work/customer_manifest.json work/tree_report.json \
            work/rebuild_noop.json work/rebuild_noop.compare.txt \
            work/rebuild_D5_VI.json work/rebuild_D5_VI.compare.txt work/rebuild_D5_VI.bmanifest.json \
            work/d5_test_source.sha256 work/d5_health_tests.txt work/d5_gps_runtime.json \
            "$R/BUILD_EVIDENCE/"
          # PRIVATE contract stays out of BUILD_EVIDENCE public copies: only the
          # hash allowlist below is public. Keep deep-validation + diff reports
          # (hash-only); NEVER copy VI_PACKAGE_CONTRACT.json/md or upgrade scripts.
          cp work/candidates/validate_A_deep.json work/candidates/validate_A_deep.md \
            work/candidates/validate_B_deep.json work/candidates/validate_B_deep.md \
            work/candidates/candidate_B_diff.json work/candidates/repack_A.json \
            "$R/BUILD_EVIDENCE/"
          # Exact PRIVATE package list; only this text hash manifest is public.
          (
            cd "$R"
            sha256sum EN_REPACK_GOLDEN.tar EN_ENHANCE_IDLE.tar \
              C2M_FLASH_A/SigmastarUpgradeSD_SSC8838G.bin C2M_FLASH_A/adas_upgrade.sh \
              C2M_FLASH_A/minieye_firmware.md5 C2M_FLASH_A/sysVer.txt \
              C2M_FLASH_D5_VI/SigmastarUpgradeSD_SSC8838G.bin C2M_FLASH_D5_VI/adas_upgrade.sh \
              C2M_FLASH_D5_VI/minieye_firmware.md5 C2M_FLASH_D5_VI/sysVer.txt > SHA256SUMS.txt
          )
          cat > "$R/FLASH_README.txt" <<'EOF'
          C2M CANDIDATE D5-VI — CI ASSEMBLY ONLY / NOT FLASH-READY / NOT FLASH-PROVEN / NOT HW-READY.

          ### Private retrieval and separately authorized local preparation
          CI preserves the STOCK VI update token (sysVer 20230920185743) in both
          raw four-file folders. Never copy raw C2M_FLASH_D5_VI/ to a card or
          assume updater acceptance. QEMU proves stock-userspace execution only,
          never hardware behavior. Verify retrieved hashes, then use
          tools/fw/reversion_sd_package.py with exact source-member SHA256 pins
          for fail-closed LOCAL version-only preparation. Suggested local D5
          token 20261016000001 is NOT minted, applied or selected by CI (DO NOT
          CI-apply). Owner-approved installed D3.1 token 20261014000006 must
          never be reused. Verify the local report, all four files and refreshed
          inner MD5; never hand-edit sysVer or mix folders.
          VI-A is a VI stock-token reference only, not an automatically usable
          rollback and never an EN rollback. Rollback is the frozen EN_D4
          deliverable (separate). EN_REPACK_GOLDEN.tar is VI-A and
          EN_ENHANCE_IDLE.tar is D5-VI in THIS deliverable; packtool reports
          retain their generic candidate-B filenames only.

          ### VI base untouched / ADAS status UNVERIFIED
          D5-VI uses the FULL VI base V2023.09.20.1_C2M_U_FR_WIFI_VI.tar
          (SHA256 f28cad049bf27437f4245ff489a784c679a20c1d867c4a63b6bcfb081b8d3cfa).
          Kernel/cardv/ADAS/models are VI stock and never mixed with EN:
          kernel 8261589e10474885277d59fea0a2ad02e079a5b94661a2f4f8f869be29364314,
          cardv 56db44d98c9af96ef38319e95374e505a128010e91ff773d2c35843d4be9bf23,
          adas 997b71c27edcd49c2b0465333f53274e73ec1086023af972a39a22dfa95527d1.
          Config/cali/license/vendor calib_success and the 8 VI WAVs are preserved.
          The VI ADAS regression cause is UNVERIFIED (settings/parsing/gating are
          candidates, not proof of incompatibility). Do not claim VI ADAS is
          incompatible and do not treat unverified behavior as proven failure.
          The stock hook still preserves its exit status; detached bounded mount
          wait launches idle, D3 boot, then the SEPARATE /customer/c2m/d4_boot.sh.
          D3 boot is unchanged. Mandatory c2m-signs performs read-only GPS plus
          offline nearby-area computation using the pinned PRIVATE directional
          R.420/R.421 subset: 12708 records, SHA256
          3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c.
          There is no optional/stale c2m-gps substitute or online DB fetch.
          No source records, labels, private IDs or coordinates are public.
          D5 carries the current GPS subsecond fix (unscaled 1-3 digit fraction
          0..999; 100/200/300 decode as milliseconds; subsecond-only churn never
          refreshes; exact production binary gated under VI stock QEMU) plus
          current connectivity V2 and an on-demand read-only D5 health snapshot
          (/customer/c2m/health.sh --help/--snapshot only; 17th file; never
          boot-launched). No M4 authorization binaries/keys/services are installed.

          ### Owner-authorized AP-only lifetime debug SSH (one flash, RAM use after)
          D5-VI adds an owner-authorized AP-only Dropbear SSH debug service
          for the owner's own camera: bind 192.168.1.1:2222 on wlan0 only,
          key-only root login with the pinned owner Ed25519 public key
          (SHA256 08517bcf7b737d76ff1dcc2c5ef0fc8f2005bf2d12a475f5be606e53a924f36d),
          no passwords, no forwarding, NO 20-minute supervisor window (lifetime-boot
          edition: window_sec=0, status lifetime=boot; serve until boot ends,
          AP loss, or child exit; AP startup still bounded at 60 s). Idle SSH
          sessions stay bounded by Dropbear -M600 and the supervisor still stops
          only its OWN listener (no pkill/killall; double-forked clients are an
          explicit limit). The persistent hostkey generates on first boot only
          under the private config dir; later boots reuse it. The service starts
          detached after D3/D4 boot and never edits radio, firewall,
          passwd/shadow/ssh or stock boot files. After one authorized flash,
          further debug runs from RAM over the owner laptop SSH session; no
          additional flashing is needed for debug. Modern SSH only (Dropbear
          2026.94, Ed25519/ECDSA, ChaCha20-Poly1305, AES-128/256); stock binaries
          are untouched. CI evidence carries only the owner key SHA256, never key
          bytes. No camera, card or device use by CI.

          ### /signs and phone/browser sound ONLY
          The AP-only :8099 /signs page shows an EXPERIMENTAL GPS/offline nearby
          area advisory, NOT camera-derived TSR or proof of road applicability.
          No numeric vehicle speed, numeric/current/legal speed limit, camera
          recognition or safety-ready claim is exposed. Missing, stale, invalid
          or unstable GPS/database/status clears the advisory; never retain a
          last-known warning as current. Status heartbeats stay in private /tmp.
          Sound is muted by default and opt-in after a user gesture, generated
          ONLY by the phone/browser. New events may beep once; no heartbeat
          replay or guaranteed background/locked-phone sound. Browser CI proves
          scheduling/presentation, not audible phone or camera hardware behavior.
          NO D4/D5 playback through stock speaker, audio IPC/UART or ADAS paths.
          Existing VI ADAS audio is preserved; D5 adds no camera audio asset.

          ### Honest connectivity and TSR limits / preserve ADAS core
          D3 UI stays on the existing stock AP interface/address, not wildcard
          or STA-facing. Boot never auto-associates a STA or replaces the AP.
          Requests require real concurrent same-channel AP+STA evidence; absence
          means refusal, not AP-to-STA switching or proof of hardware absence.
          DHCP, STA association and Internet access are NOT proven or promised.
          Bluetooth is read-only presence inventory, not pairing/radio proof.
          Credentials/settings stay private. Synthetic/Chrome tests use only
          fixtures and loopback, never real credentials, GPS, device or card.
          Existing D TSR flags/profile are unchanged. Recognition, display,
          warning behavior, threshold units/choices and hardware boot remain
          UNVERIFIED; APPLIED_WAIT_STOCK_REDECODE is not recognition proof.
          VI ADAS behavior is UNVERIFIED, not proven incompatible.
          No stock Warner/GPS/ADAS/cardv/camera/model/calibration/kernel/bootloader
          binary changes. Manifest/deep-validation/allowlist gates preserve the
          core outside the narrow VI C/D/D3/D4/health/lifetime-debug additions and
          hook/audio changes. This is the STOCK FULL UPDATER, not a customer-only
          write; it may also write unchanged core partitions. Never substitute a
          custom flasher. OPEN_SOURCE retains supplicant/libnl sources, recipe and
          relink objects plus the pinned Dropbear tarball, license and debug
          build sources.

          ### Hardware validation is separate, never performed by this CI
          Only after verified local preparation follow FLASH_HW_CHECKLIST.md
          with stable power, known-good FAT32 media and a recovery plan. Check
          boot, camera/recording, ADAS/display, stock AP, reboot and diagnostics
          before supervised /signs tests; use only the complete locally prepared
          D5-VI folder. QEMU proves stock-userspace execution, not hardware. No CI
          card/device access, workflow-triggered update or token reversion occurs.
          Do not rely on TSR, GPS, nearby-area data, connectivity or beep for safety.
          A full D5 tested flash folder still needs verified local preparation after CI.
          EOF
          cat "$R/SHA256SUMS.txt"
      - name: Publish D5-VI release to private vault (firmware, DB and owner-key bytes stay private)
        env:
          FIRMWARE_VAULT_PUSH_KEY: ${{ secrets.FIRMWARE_VAULT_PUSH_KEY }}
        run: |
          test -n "$FIRMWARE_VAULT_PUSH_KEY" || \
            { echo "FIRMWARE_VAULT_PUSH_KEY secret missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$FIRMWARE_VAULT_PUSH_KEY" > ~/.ssh/fw_vault_push
          chmod 600 ~/.ssh/fw_vault_push
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fw_vault_push -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:vunguyenbv175/c2m-firmware-vault.git /tmp/vault-out
          D="deliverables/$(date -u +%Y%m%d)-d5-vi-r${GITHUB_RUN_ID}"
          echo "VAULT_DIR=$D" >> $GITHUB_ENV
          mkdir -p "/tmp/vault-out/$D"
          cp -r release/c2m-flash "/tmp/vault-out/$D/"
          cd /tmp/vault-out && git add "$D" \
            && git -c user.name=c2m-ci -c user.email=c2m-ci@local \
               commit -m "candidate D5-VI private flash deliverables ${D} (VI stock token; local preparation required)" \
            && git push origin main
          rm -rf /tmp/vault-out ~/.ssh/fw_vault_push
          echo "VAULT-DIR: $D"
