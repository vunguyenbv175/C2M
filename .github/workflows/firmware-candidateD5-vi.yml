name: firmware-candidateD5-vi
# MANUAL ONLY. D5-VI = FULL VI BASE (V2023.09.20.1_C2M_U_FR_WIFI_VI.tar) plus
# all of D4-debug (C VI audio/idle + checked D TSR profile + D3 AP-only
# UI/connectivity gates + mandatory isolated GPS/offline-area producer + AP-only
# debug SSH service) EXCEPT the 20-minute supervisor window is REMOVED.
# D5 lifetime-boot edition: SSH key-only AP persists for the whole boot
# (supervisor window 0, status lifetime=boot), AP loss / SIGTERM / child exit
# still stops the owned listener, idle sessions stay bounded by -M600.
# Owner-approved package preparation only. Camera access, card staging and
# flashing require a separately notified session. Modern SSH only.
# Never stock-speaker output, numeric speed/current-limit display or camera TSR.
# No stock camera/kernel/ADAS/GPS/cardv/model binary changes; no radio/device/card use.
# VI BASE IS UNTOUCHED: kernel/cardv/ADAS/models are VI stock, never mixed with
# EN. Config/cali/license/vendor calib_success and the 8 VI WAVs are preserved.
# VI ADAS regression cause is UNVERIFIED (settings/parsing/gating differences
# are candidates, not proof); never claim VI ADAS is incompatible.
# D5 minimum delta vs D4-debug: current GPS subsecond fix (fraction<=999),
# current connectivity V2, lifetime SSH, on-demand read-only D5 health
# collector (fw/d5/health.sh, 16+1=17th file, NO BOOT LAUNCH), plus D5
# release/provenance. Exact D4 production runtime is gated under VI stock QEMU.
# No M4 authorization binaries/keys/services are installed. No auto TSR forcing
# or new ADAS enable: legacy checked D TSR profile only (--tsr-experiment).
#
# D5 health source (fw/d5/health.sh) is public-safe plain source: on-demand
# read-only snapshot only (--help/--snapshot), no boot launch, no writes,
# no GPS payload/socket/USB/UART/config/process control. The private VI
# package contract (work/VI_PACKAGE_CONTRACT.json/.md) holds vendor script
# bytes and is NEVER a public artifact (not in evidence, not in release).
#
# Firmware/audio/database/owner-key bytes stay in the PRIVATE vault.
# Independently pin the VI TAR, all eight VI WAVs, the exact prefiltered
# directional D4 DB, the exact owner debug_owner.pub and the upstream
# Dropbear 2026.94 tarball:
#   VI TAR f28cad049bf27437f4245ff489a784c679a20c1d867c4a63b6bcfb081b8d3cfa
#   VI sysVer 20230920185743 (stock token preserved; NOT FLASH-READY)
#   VI inner 9ec1c85ec0d8b69ee4cfbe3ae557c882439d3a5a6c99c5998b7a81ec7b87c53a
#   VI kernel 8261589e10474885277d59fea0a2ad02e079a5b94661a2f4f8f869be29364314
#   VI cardv 56db44d98c9af96ef38319e95374e505a128010e91ff773d2c35843d4be9bf23
#   VI adas 997b71c27edcd49c2b0465333f53274e73ec1086023af972a39a22dfa95527d1
#   debug owner pub 08517bcf7b737d76ff1dcc2c5ef0fc8f2005bf2d12a475f5be606e53a924f36d
#   D4 DB 3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c (12708)
#   stock NSS 381a2aa8348259f1722aa09a90c4345a4460a94350d60b1df6782b3dc23ebffd (361400)
#   dropbear 2026.94 e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81
# Parent must publish that exact private subset (assets/debug/debug_owner.pub)
# before this workflow is run. The owner key is public-key material but is
# fetched ONLY from the private vault; only its SHA256 ever enters CI logs or
# public evidence, never key bytes. Parent keeps a local LF-normalized copy
# that matches the strict one-line ssh-ed25519 check.
# No optional c2m-gps scaffold: c2m-signs and its stock-ABI gates are mandatory.
#
# Private VI package contract is derived in-workflow to
# work/VI_PACKAGE_CONTRACT.json (+ .md) via tools/fw/package_contract.py and
# is NEVER a public artifact. Validator/builder use --base-profile vi with
# --contract work/VI_PACKAGE_CONTRACT.json and --base-tar <VI tar>
# (other agent adds --base-tar alias + --base-profile {en,vi}).
# Packtool outputs keep their generic EN filenames (EN_REPACK_GOLDEN.tar is
# VI-A and EN_ENHANCE_IDLE.tar is D5-VI in THIS deliverable); the release
# README renames them explicitly at release.
# All QEMU sysroots are VI stock from the VI carve; stock lib pins are verified
# (VI NSS hash is identical to the EN pin; any mismatch STOPS the run).
#
# CI preserves the STOCK VI update token: NOT FLASH-READY until separately verified
# local version-only preparation. Suggested local D5 token 20261016000001 is
# NOT minted, applied or selected by CI (DO NOT CI-apply). Owner-approved
# installed D3.1 token 20261014000006 must never be reused.
# Rollback is the frozen EN_D4 deliverable, not the VI stock A reference:
# VI-A is a stock-token reference only, never claimed as EN rollback.
# Public artifacts use an explicit evidence-only list: NO firmware, ARM binaries,
# audio, raw DB, credentials, owner/host keys, hostkey material, PEM, raw device
# config, coordinates, private record IDs, vendor contract JSON/MD, upgrade
# script text, or carve script bytes. Plain source, synthetic tests and hashes
# are safe evidence (hash-only for vendor bytes); upstream configure/build/keygen
# logs stay PRIVATE (the QEMU keygen smoke uses synthetic keys only).
# The D4 evidence list wrongly published contract MD/JSON (vendor script bytes);
# D5 explicitly excludes them: public hash only is safe. Gates fail closed.
"on":
  workflow_dispatch:
jobs:
  candidate-d5-vi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host-only checked TSR experiment tests (GATE)
        run: |
          mkdir -p work
          test -x /bin/sh
          /bin/sh -n fw/tsr/tsr_profile_boot.sh
          if ! python3 tools/fw/test_tsr_experiment.py > work/tsr_experiment_tests.txt 2>&1; then
            cat work/tsr_experiment_tests.txt
            exit 1
          fi
          cat work/tsr_experiment_tests.txt
          python3 tools/fw/test_restore_vi_base.py
          python3 tests/test_tree_ownership.py
          python3 tests/test_d4_stock_paths.py
          python3 tests/test_d3_vi_paths.py
          cp fw/tsr/tsr_profile_boot.sh work/tsr_profile_boot.sh
          sha256sum work/tsr_profile_boot.sh > work/tsr_profile_boot.sha256
      - name: Fetch VI TAR + exact VI audio + private D4 subset + debug owner pub and verify independent pins (GATE)
        env:
          FIRMWARE_VAULT_KEY: ${{ secrets.FIRMWARE_VAULT_KEY }}
        run: |
          test -n "$FIRMWARE_VAULT_KEY" || \
            { echo "FIRMWARE_VAULT_KEY secret missing"; exit 1; }
          mkdir -p ~/.ssh firmware/original
          printf '%s\n' "$FIRMWARE_VAULT_KEY" > ~/.ssh/fw_vault
          chmod 600 ~/.ssh/fw_vault
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fw_vault -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:vunguyenbv175/c2m-firmware-vault.git /tmp/fw-vault
          python3 tools/fw/restore_vi_base.py --vault /tmp/fw-vault \
            --output firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar
          echo "f28cad049bf27437f4245ff489a784c679a20c1d867c4a63b6bcfb081b8d3cfa  firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar" \
            | sha256sum -c -
          # Shared private vault retains EN for rollback; never copy it into this VI build.
          test ! -f firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar
          python3 - <<'EOF'
          import tarfile
          with tarfile.open("firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar") as tf:
            sysver = tf.extractfile("sysVer.txt").read()
          assert sysver == b"sysVer 20230920185743\nend\n", sysver
          print("VI sysVer token preserved (stock; NOT FLASH-READY)")
          EOF
          cat > work/vi_audio_SHA256SUMS.txt <<'EOF'
          da07eae4699be3b06f23f5849923ebd7a96e4ba02a2b542b3cf52cc5ffa6951b  vi_LDW.wav
          ca936446d3c3d538314e70fb8e27b095edcc67076775e8ad2fe20ed7b28fd93b  vi_PCW.wav
          f63818ee429255a4e4beca8799b0956e40984051f8f558eb5725356247ae2581  vi_SAG.wav
          1efa8d01880d17aa77a8a846031ed24c2820f331841a667cf92d83c0b32e0c92  vi_VB.wav
          f8e27c89c9121341bfe5d88e390dbffbb6baddea4a2e800a46da2c4ddd9c407f  vi_adas_activated.wav
          be268e0c3b0981833b2e58488f37dea394b4cd8581a515530ebc4fed9e3c9ebe  vi_adas_fail.wav
          b9433c6e4813f8334bbfdbb2148f5a82e1c3be4484f5584d759540fb29a6e1bf  vi_updating.wav
          36ef89d27a3a1ee8fa71c1dcf0100308545f65befc8a1d1d12ba2e815844acbd  tlr_green_on.wav
          EOF
          mkdir -p work/vi-audios work/d4-private
          chmod 700 work/d4-private
          while read -r hash filename; do
            cp "/tmp/fw-vault/assets/vi-audios/$filename" "work/vi-audios/$filename"
          done < work/vi_audio_SHA256SUMS.txt
          (cd work/vi-audios && sha256sum --strict -c ../vi_audio_SHA256SUMS.txt)
          test -f /tmp/fw-vault/assets/d4/signs-d4.bin
          test ! -L /tmp/fw-vault/assets/d4/signs-d4.bin
          cp /tmp/fw-vault/assets/d4/signs-d4.bin work/d4-private/signs-d4.bin
          chmod 600 work/d4-private/signs-d4.bin
          python3 - <<'EOF'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/fw")
          from mutate_customer import check_d4_database
          path = Path("work/d4-private/signs-d4.bin")
          if path.is_symlink() or not path.is_file() or path.stat().st_size != 1270812:
              raise SystemExit("D5-VI-GATE: private DB regular-file/length mismatch")
          report = check_d4_database(path.read_bytes(),
              "3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c")
          if report["count"] != 12708:
              raise SystemExit("D5-VI-GATE: private DB count mismatch")
          # Only the hash and count leave this gate; never records or labels.
          safe = {"sha256": report["sha256"], "count": report["count"]}
          Path("work/d4_database.json").write_text(json.dumps(safe, indent=2) + "\n")
          print(json.dumps(safe, sort_keys=True))
          EOF
          mkdir -p work/debug-private
          chmod 700 work/debug-private
          test -f /tmp/fw-vault/assets/debug/debug_owner.pub
          test ! -L /tmp/fw-vault/assets/debug/debug_owner.pub
          cp /tmp/fw-vault/assets/debug/debug_owner.pub work/debug-private/debug_owner.pub
          chmod 600 work/debug-private/debug_owner.pub
          python3 - <<'EOF'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/fw")
          from mutate_customer import check_debug_owner_key
          path = Path("work/debug-private/debug_owner.pub")
          if path.is_symlink() or not path.is_file():
              raise SystemExit("DEBUG-GATE: owner key regular-file mismatch")
          report = check_debug_owner_key(path.read_bytes(),
              "08517bcf7b737d76ff1dcc2c5ef0fc8f2005bf2d12a475f5be606e53a924f36d")
          # Only the hash leaves this gate; never key bytes.
          safe = {"sha256": report["sha256"]}
          Path("work/debug_owner.json").write_text(json.dumps(safe, indent=2) + "\n")
          print(json.dumps(safe, sort_keys=True))
          EOF
          rm -rf /tmp/fw-vault ~/.ssh/fw_vault
      - name: Derive private VI package contract from exact pinned VI input (GATE; NEVER public)
        run: |
          mkdir -p work
          python3 tools/fw/package_contract.py \
            --tar firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar \
            --out-json work/VI_PACKAGE_CONTRACT.json \
            --out-md work/VI_PACKAGE_CONTRACT.md
          python3 - <<'EOF'
          import json
          from pathlib import Path
          c = json.loads(Path("work/VI_PACKAGE_CONTRACT.json").read_text())
          assert c["source_tar_sha256"] == "f28cad049bf27437f4245ff489a784c679a20c1d867c4a63b6bcfb081b8d3cfa", "VI tar pin mismatch"
          assert c["source_tar_sha256"] != "3a703522df31f8accd58069850be0a01c2ac5ecbf12af1705ccb4904cd465f8c", "EN mix refused"
          assert c["sysVer_txt"] == "sysVer 20230920185743\nend\n", "VI sysVer mismatch"
          assert c["inner_size"] == 58105880, c["inner_size"]
          assert c["inner_sha256"] == "9ec1c85ec0d8b69ee4cfbe3ae557c882439d3a5a6c99c5998b7a81ec7b87c53a"
          assert "20230920185743" in c["upgrade_script_text"], "VI script sysVer missing"
          by = {(r["section"], r["load_index"]): r for r in c["loads"]}
          assert by[("kernel.es", 0)]["sha256"] == "8261589e10474885277d59fea0a2ad02e079a5b94661a2f4f8f869be29364314", "VI kernel mix refused"
          assert by[("kernel.es", 0)]["sha256"] != "c1fa8f7363615f1dc7d91f3308608d336fee6d89f5dcfe48e826bf4a399f5030", "EN kernel mix refused"
          assert by[("rootfs.es", 0)]["sha256"] == "f90f109a29711ad926e8d302df083ef4eb24876bd2c4183c2b5a6f0c16ab6edc"
          assert by[("customer.es", 0)]["sha256"] == "7325f9fffa461596273ae30995b4e69d80d380da5aa1cbea0f874e904b599c93"
          assert c["tail_unknown"]["hex"] == "31323334353637380a232046696c6520506172746974696f", "VI tail mismatch"
          # This file holds vendor script bytes: keep PRIVATE, never upload.
          print("VI-CONTRACT: OK (VI-only; vendor bytes stay in work/, never public)")
          EOF
          chmod 600 work/VI_PACKAGE_CONTRACT.json work/VI_PACKAGE_CONTRACT.md
      - name: Install toolchain and require host/browser runtimes (GATE; versions recorded)
        run: |
          mkdir -p work
          sudo apt-get update && sudo apt-get install -y \
            build-essential mtd-utils gcc-arm-linux-gnueabihf ninja-build liblzo2-dev \
            qemu-user-static cpio curl pkg-config flex bison
          mkfs.ubifs -h 2>&1 | head -3
          arm-linux-gnueabihf-gcc --version
          gcc --version | head -1
          qemu-arm-static --version | head -1
          # Ubuntu's preinstalled Node and Chrome are REQUIRED, never silent skips.
          command -v node
          node --version
          python3 - <<'EOF'
          import shutil
          import subprocess
          browser = next((p for name in ("google-chrome", "chromium", "chromium-browser")
                          if (p := shutil.which(name))), None)
          if not browser:
              raise SystemExit("D5-VI-GATE: Chrome/Chromium is required")
          subprocess.run([browser, "--version"], check=True)
          EOF
          python3 -m pip install websocket-client
          python3 -c 'import websocket'
          dpkg-query -W build-essential gcc mtd-utils gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross liblzo2-dev qemu-user-static cpio > work/tool_versions.txt
          node --version >> work/tool_versions.txt
          python3 -m pip show websocket-client >> work/tool_versions.txt
      - name: Inspect VI package + geometry + manifest
        run: |
          mkdir -p work
          python3 tools/fw/carve_upgrade.py \
            firmware/original/V2023.09.20.1_C2M_U_FR_WIFI_VI.tar -o work/carve
          CUST=$(ls work/carve/customer.es.load0.*.bin)
          echo "CUST=$CUST" >> $GITHUB_ENV
          python3 tools/fw/ubifs_geometry.py "$CUST" -o work/customer_geometry.json
          python3 tools/fw/ubifs_manifest.py "$CUST" -o work/customer_manifest.json
          # VI base preservation: stock VI audios already carry the VI pins.
          python3 - <<'EOF'
          import hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/fw")
          from ubifs_extract_file import extract
          cust = next(Path("work/carve").glob("customer.es.load0.*.bin"))
          pins = {"LDW.wav": "da07eae4699be3b06f23f5849923ebd7a96e4ba02a2b542b3cf52cc5ffa6951b",
                  "PCW.wav": "ca936446d3c3d538314e70fb8e27b095edcc67076775e8ad2fe20ed7b28fd93b",
                  "SAG.wav": "f63818ee429255a4e4beca8799b0956e40984051f8f558eb5725356247ae2581",
                  "VB.wav": "1efa8d01880d17aa77a8a846031ed24c2820f331841a667cf92d83c0b32e0c92",
                  "adas_activated.wav": "f8e27c89c9121341bfe5d88e390dbffbb6baddea4a2e800a46da2c4ddd9c407f",
                  "adas_fail.wav": "be268e0c3b0981833b2e58488f37dea394b4cd8581a515530ebc4fed9e3c9ebe",
                  "updating.wav": "b9433c6e4813f8334bbfdbb2148f5a82e1c3be4484f5584d759540fb29a6e1bf"}
          for name, want in pins.items():
              blob, _ = extract(cust, f"/minieye/adas/audios/{name}")
              got = hashlib.sha256(blob).hexdigest()
              assert got == want, f"VI stock WAV {name} mismatch"
          print("VI-STOCK-AUDIO: 7 VI WAVs preserved in VI base (tlr added by mutator)")
          EOF
      - name: P1 no-op rebuild (GATE)
        run: |
          python3 tools/fw/ubifs_extract_tree.py "$CUST" work/tree \
            --manifest work/customer_manifest.json --report work/tree_report.json
          sudo bash tools/fw/rebuild_customer.sh --mode noop \
            --tree work/tree --tree-report work/tree_report.json \
            --geometry work/customer_geometry.json \
            --stock-manifest work/customer_manifest.json \
            --out work/customer_noop.es --report work/rebuild_noop.json
      - name: P0 dynamic idle binary (unchanged C stock-ABI path)
        run: |
          cmake -S "${{ github.workspace }}/fw/device_minimal" -B build/arm-dyn-b \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/fw/device_minimal/toolchain-armhf-dyn.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/arm-dyn-b --verbose
          arm-linux-gnueabihf-readelf -S build/arm-dyn-b/CMakeFiles/c2m-idle.dir/start.S.o | grep -E "note|attributes"
          arm-linux-gnueabihf-objdump -d build/arm-dyn-b/CMakeFiles/c2m-idle.dir/start.S.o | head -30
          python3 fw/device_minimal/check_elf.py build/arm-dyn-b/c2m-idle --allow-dynamic
          sha256sum build/arm-dyn-b/c2m-idle > work/c2m_idle.sha256
      - name: QEMU VI stock-rootfs runtime proof + stock lib pins (exact idle binary; not hardware proof)
        run: |
          mkdir -p work/sysroot && cd work/sysroot
          gunzip -c ../carve/rootfs.es.load0.*.bin | cpio -id --no-absolute-filenames
          cd ../..
          mkdir -p work/sysroot/tmp
          cp build/arm-dyn-b/c2m-idle work/sysroot/tmp/c2m-idle
          sha256sum work/sysroot/tmp/c2m-idle > work/qemu_bin.sha256
          rm -f /tmp/c2m_idle.marker work/sysroot/tmp/c2m_idle.marker
          timeout -s KILL 10 qemu-arm-static -L work/sysroot work/sysroot/tmp/c2m-idle \
            > work/qemu_out.txt 2>&1 || [ $? -eq 137 ]
          cat work/qemu_out.txt
          grep -q "c2m-idle 0.2.0-sdlog1" work/qemu_out.txt
          marker=work/sysroot/tmp/c2m_idle.marker
          if [ ! -f "$marker" ]; then marker=/tmp/c2m_idle.marker; fi
          test -f "$marker" && test ! -L "$marker"
          cat "$marker"
          grep -qx "c2m-idle 0.2.0-sdlog1" "$marker"
          echo "QEMU-RUNTIME: PASS (VI stock glibc-2.30 userspace; stdout + marker verified)"
          # Pinned VI stock NSS check: same 361400-byte module as EN pin.
          # Any mismatch STOPS the run (report, do not proceed).
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/fw")
          from mutate_customer import check_debug_nss
          source = Path("work/tree/ssh/lib/libnss_files.so.2")
          if source.is_symlink() or not source.is_file():
              raise SystemExit("D5-VI-GATE: VI stock NSS source unavailable")
          data = source.read_bytes()
          print(check_debug_nss(data))
          prefix = Path("work/sysroot/customer/c2m")
          prefix.mkdir(parents=True, exist_ok=True)
          target = prefix / "libnss_files.so.2"
          target.write_bytes(data)
          target.chmod(0o644)
          Path("work/sysroot/etc/nsswitch.conf").write_text("passwd: files\ngroup: files\n")
          EOF
          # VI stock rootfs cardv/ADAS pins (identical-path check; parent validates
          # VI-identical stock libs when needed). Never mix EN binaries.
          python3 - <<'EOF'
          import gzip, hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/fw")
          from extract_rootfs_cpio import iter_cpio
          from ubifs_extract_file import extract
          blob = next(Path("work/carve").glob("rootfs.es.load0.*.bin")).read_bytes()
          cpio = dict(iter_cpio(gzip.decompress(blob)))
          cardv = cpio.get("bootconfig/bin/cardv")
          assert cardv is not None, "VI cardv missing"
          assert hashlib.sha256(cardv).hexdigest() == "56db44d98c9af96ef38319e95374e505a128010e91ff773d2c35843d4be9bf23", "EN cardv mix refused"
          assert hashlib.sha256(cardv).hexdigest() != "344b4a3fdc1cfbb13e6d1ee8a45cd2c9c99b8d63d1f90e8c193a1cc89a288a8c", "EN cardv mix refused"
          cust = next(Path("work/carve").glob("customer.es.load0.*.bin"))
          adas, _ = extract(cust, "/minieye/adas/adas")
          assert hashlib.sha256(adas).hexdigest() == "997b71c27edcd49c2b0465333f53274e73ec1086023af972a39a22dfa95527d1", "EN adas mix refused"
          assert hashlib.sha256(adas).hexdigest() != "0dcc69828078e4e243b17ca9508d15ca6b47a3c2f6ec59d6c20bc5b5e9c94043", "EN adas mix refused"
          print("VI-STOCK-PINS: cardv+adas are VI stock (EN mix refused)")
          EOF
          test -f work/sysroot/lib/ld-linux-armhf.so.3
          # The archive has no '/' entry. QEMU maps stat('/') to this prefix,
          # so match the camera's kernel root (not the checkout runner UID).
          sudo chown 0:0 work/sysroot
          sudo chmod 755 work/sysroot
      - name: Execute D profile tests with exact VI stock BusyBox applets (GATE)
        run: |
          cat > work/stock-sh <<'EOF'
          #!/bin/sh
          exec /usr/bin/qemu-arm-static -L "$C2M_TEST_SYSROOT" "$C2M_TEST_SYSROOT/bin/busybox" sh "$@"
          EOF
          chmod +x work/stock-sh
          mkdir -p work/stock-applets
          for app in awk base64 cat cmp cp grep head md5sum mkdir mv rm sync uname wc; do
            printf '#!/bin/sh\nexec /usr/bin/qemu-arm-static -L "$C2M_TEST_SYSROOT" "$C2M_TEST_SYSROOT/bin/busybox" %s "$@"\n' "$app" > "work/stock-applets/$app"
