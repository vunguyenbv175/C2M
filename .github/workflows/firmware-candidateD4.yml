name: firmware-candidateD4
# MANUAL ONLY. D4 = unchanged C VI audio/idle + checked D TSR profile + D3
# AP-only UI/connectivity gates + mandatory isolated GPS/offline-area producer.
# Owner-approved: offline computation, /signs visual and opt-in PHONE/BROWSER beep.
# Never stock-speaker output, numeric speed/current-limit display or camera TSR.
# No stock camera/kernel/ADAS/GPS/cardv/model binary changes; no radio/device/card use.
#
# Firmware/audio/database bytes stay in the PRIVATE vault. Independently pin
# the EN TAR, all eight C WAVs and the exact prefiltered directional D4 DB.
# Parent must publish that exact private subset before this workflow is run.
# No optional c2m-gps scaffold: c2m-signs and its stock-ABI gates are mandatory.
#
# CI preserves the STOCK update token: NOT FLASH-READY until separately verified
# local version-only preparation. The reserved local D4 token is NOT a CI input.
# Public artifacts use an explicit evidence-only list: no firmware, ARM binaries,
# audio, raw DB, credentials, raw device config, coordinates or private record IDs.
# Plain source, synthetic tests and hashes are safe evidence; gates fail closed.
"on":
  workflow_dispatch:
jobs:
  candidate-d4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host-only checked TSR experiment tests (GATE)
        run: |
          mkdir -p work
          test -x /bin/sh
          /bin/sh -n fw/tsr/tsr_profile_boot.sh
          if ! python3 tools/fw/test_tsr_experiment.py > work/tsr_experiment_tests.txt 2>&1; then
            cat work/tsr_experiment_tests.txt
            exit 1
          fi
          cat work/tsr_experiment_tests.txt
          cp fw/tsr/tsr_profile_boot.sh work/tsr_profile_boot.sh
          sha256sum work/tsr_profile_boot.sh > work/tsr_profile_boot.sha256
      - name: Fetch EN TAR + exact C audio + private D4 subset and verify independent pins (GATE)
        env:
          FIRMWARE_VAULT_KEY: ${{ secrets.FIRMWARE_VAULT_KEY }}
        run: |
          test -n "$FIRMWARE_VAULT_KEY" || \
            { echo "FIRMWARE_VAULT_KEY secret missing"; exit 1; }
          mkdir -p ~/.ssh firmware/original
          printf '%s\n' "$FIRMWARE_VAULT_KEY" > ~/.ssh/fw_vault
          chmod 600 ~/.ssh/fw_vault
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fw_vault -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:vunguyenbv175/c2m-firmware-vault.git /tmp/fw-vault
          cp /tmp/fw-vault/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar \
            firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar
          echo "3a703522df31f8accd58069850be0a01c2ac5ecbf12af1705ccb4904cd465f8c  firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar" \
            | sha256sum -c -
          cat > work/vi_audio_SHA256SUMS.txt <<'EOF'
          da07eae4699be3b06f23f5849923ebd7a96e4ba02a2b542b3cf52cc5ffa6951b  vi_LDW.wav
          ca936446d3c3d538314e70fb8e27b095edcc67076775e8ad2fe20ed7b28fd93b  vi_PCW.wav
          f63818ee429255a4e4beca8799b0956e40984051f8f558eb5725356247ae2581  vi_SAG.wav
          1efa8d01880d17aa77a8a846031ed24c2820f331841a667cf92d83c0b32e0c92  vi_VB.wav
          f8e27c89c9121341bfe5d88e390dbffbb6baddea4a2e800a46da2c4ddd9c407f  vi_adas_activated.wav
          be268e0c3b0981833b2e58488f37dea394b4cd8581a515530ebc4fed9e3c9ebe  vi_adas_fail.wav
          b9433c6e4813f8334bbfdbb2148f5a82e1c3be4484f5584d759540fb29a6e1bf  vi_updating.wav
          36ef89d27a3a1ee8fa71c1dcf0100308545f65befc8a1d1d12ba2e815844acbd  tlr_green_on.wav
          EOF
          mkdir -p work/vi-audios work/d4-private
          chmod 700 work/d4-private
          while read -r hash filename; do
            cp "/tmp/fw-vault/assets/vi-audios/$filename" "work/vi-audios/$filename"
          done < work/vi_audio_SHA256SUMS.txt
          (cd work/vi-audios && sha256sum --strict -c ../vi_audio_SHA256SUMS.txt)
          test -f /tmp/fw-vault/assets/d4/signs-d4.bin
          test ! -L /tmp/fw-vault/assets/d4/signs-d4.bin
          cp /tmp/fw-vault/assets/d4/signs-d4.bin work/d4-private/signs-d4.bin
          chmod 600 work/d4-private/signs-d4.bin
          python3 - <<'EOF'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/fw")
          from mutate_customer import check_d4_database
          path = Path("work/d4-private/signs-d4.bin")
          if path.is_symlink() or not path.is_file() or path.stat().st_size != 1270812:
              raise SystemExit("D4-GATE: private DB regular-file/length mismatch")
          report = check_d4_database(path.read_bytes(),
              "3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c")
          if report["count"] != 12708:
              raise SystemExit("D4-GATE: private DB count mismatch")
          # Only the hash and count leave this gate; never records or labels.
          safe = {"sha256": report["sha256"], "count": report["count"]}
          Path("work/d4_database.json").write_text(json.dumps(safe, indent=2) + "\n")
          print(json.dumps(safe, sort_keys=True))
          EOF
          rm -rf /tmp/fw-vault ~/.ssh/fw_vault
      - name: Install toolchain and require host/browser runtimes (GATE; versions recorded)
        run: |
          mkdir -p work
          sudo apt-get update && sudo apt-get install -y \
            build-essential mtd-utils gcc-arm-linux-gnueabihf ninja-build liblzo2-dev \
            qemu-user-static cpio curl pkg-config flex bison
          mkfs.ubifs -h 2>&1 | head -3
          arm-linux-gnueabihf-gcc --version
          gcc --version | head -1
          qemu-arm-static --version | head -1
          # Ubuntu's preinstalled Node and Chrome are REQUIRED, never silent skips.
          command -v node
          node --version
          python3 - <<'EOF'
          import shutil
          import subprocess
          browser = next((p for name in ("google-chrome", "chromium", "chromium-browser")
                          if (p := shutil.which(name))), None)
          if not browser:
              raise SystemExit("D4-GATE: Chrome/Chromium is required")
          subprocess.run([browser, "--version"], check=True)
          EOF
          python3 -m pip install websocket-client
          python3 -c 'import websocket'
          dpkg-query -W build-essential gcc mtd-utils gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross liblzo2-dev qemu-user-static cpio > work/tool_versions.txt
          node --version >> work/tool_versions.txt
          python3 -m pip show websocket-client >> work/tool_versions.txt
      - name: Inspect EN package + geometry + manifest
        run: |
          mkdir -p work
          python3 tools/fw/carve_upgrade.py \
            firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar -o work/carve
          CUST=$(ls work/carve/customer.es.load0.*.bin)
          echo "CUST=$CUST" >> $GITHUB_ENV
          python3 tools/fw/ubifs_geometry.py "$CUST" -o work/customer_geometry.json
          python3 tools/fw/ubifs_manifest.py "$CUST" -o work/customer_manifest.json
      - name: P1 no-op rebuild (GATE)
        run: |
          python3 tools/fw/ubifs_extract_tree.py "$CUST" work/tree \
            --manifest work/customer_manifest.json --report work/tree_report.json
          sudo bash tools/fw/rebuild_customer.sh --mode noop \
            --tree work/tree --tree-report work/tree_report.json \
            --geometry work/customer_geometry.json \
            --stock-manifest work/customer_manifest.json \
            --out work/customer_noop.es --report work/rebuild_noop.json
      - name: P0 dynamic idle binary (unchanged C stock-ABI path)
        run: |
          cmake -S "${{ github.workspace }}/fw/device_minimal" -B build/arm-dyn-b \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/fw/device_minimal/toolchain-armhf-dyn.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/arm-dyn-b --verbose
          arm-linux-gnueabihf-readelf -S build/arm-dyn-b/CMakeFiles/c2m-idle.dir/start.S.o | grep -E "note|attributes"
          arm-linux-gnueabihf-objdump -d build/arm-dyn-b/CMakeFiles/c2m-idle.dir/start.S.o | head -30
          python3 fw/device_minimal/check_elf.py build/arm-dyn-b/c2m-idle --allow-dynamic
          sha256sum build/arm-dyn-b/c2m-idle > work/c2m_idle.sha256
      - name: QEMU stock-rootfs runtime proof (exact idle binary; not hardware proof)
        run: |
          mkdir -p work/sysroot && cd work/sysroot
          gunzip -c ../carve/rootfs.es.load0.*.bin | cpio -id --no-absolute-filenames
          cd ../..
          mkdir -p work/sysroot/tmp
          cp build/arm-dyn-b/c2m-idle work/sysroot/tmp/c2m-idle
          sha256sum work/sysroot/tmp/c2m-idle > work/qemu_bin.sha256
          rm -f /tmp/c2m_idle.marker
          timeout -s KILL 10 qemu-arm-static -L work/sysroot work/sysroot/tmp/c2m-idle \
            > work/qemu_out.txt 2>&1 || [ $? -eq 137 ]
          cat work/qemu_out.txt
          grep -q "c2m-idle 0.2.0-sdlog1" work/qemu_out.txt
          cat /tmp/c2m_idle.marker
          grep -qx "c2m-idle 0.2.0-sdlog1" /tmp/c2m_idle.marker
          echo "QEMU-RUNTIME: PASS (stock glibc-2.30 userspace; stdout + marker verified)"
      - name: Execute D profile tests with exact stock BusyBox applets (GATE)
        run: |
          cat > work/stock-sh <<'EOF'
          #!/bin/sh
          exec /usr/bin/qemu-arm-static -L "$C2M_TEST_SYSROOT" "$C2M_TEST_SYSROOT/bin/busybox" sh "$@"
          EOF
          chmod +x work/stock-sh
          mkdir -p work/stock-applets
          for app in awk base64 cat cmp cp grep head md5sum mkdir mv rm sync uname wc; do
            printf '#!/bin/sh\nexec /usr/bin/qemu-arm-static -L "$C2M_TEST_SYSROOT" "$C2M_TEST_SYSROOT/bin/busybox" %s "$@"\n' "$app" > "work/stock-applets/$app"
            chmod +x "work/stock-applets/$app"
          done
          export C2M_TEST_SYSROOT="$PWD/work/sysroot"
          export C2M_TSR_TEST_SHELL="$PWD/work/stock-sh"
          export C2M_TSR_TEST_TIMEOUT=60
          export PATH="$PWD/work/stock-applets:$PATH"
          python3 tools/fw/test_tsr_experiment.py > work/tsr_stock_busybox_tests.txt 2>&1 || \
            { cat work/tsr_stock_busybox_tests.txt; exit 1; }
          cat work/tsr_stock_busybox_tests.txt
      - name: D3 stock-ABI build + QEMU + host synthetic and real Chrome gates (GATE)
        run: |
          # No live radio/network. Never put this group in `if ! (...)`, which
          # disables errexit throughout the subshell and can hide build failures.
          trap 'cat work/d3_build_tests.txt' ERR
          (
            set -eu
            bash fw/d3/build.sh --out work/d3-services --sysroot work/sysroot
            bash fw/d3/build_supplicant.sh --out work/d3-services --sysroot work/sysroot
            cp work/d3-services/supplicant_SOURCE.json work/d3_supplicant_source.json
            for file in boot.sh connectivity_probe.sh c2m-web c2m-wifi wpa_supplicant; do
              test -f "work/d3-services/$file"
              test ! -L "work/d3-services/$file"
              test -x "work/d3-services/$file"
            done
            export C2M_TEST_SYSROOT="$PWD/work/sysroot"
            "$PWD/work/stock-sh" -n work/d3-services/boot.sh
            "$PWD/work/stock-sh" -n work/d3-services/connectivity_probe.sh
            cmp -s fw/d3/connectivity_probe.sh work/d3-services/connectivity_probe.sh
            grep -q 'probe=C2M_D3_PASSIVE_BLUETOOTH_V2' work/d3-services/connectivity_probe.sh
            (
              export C2M_PROBE_SHELL="$(python3 -c 'import json, os; print(json.dumps([os.path.abspath("work/stock-sh")]))')"
              export PATH="$PWD/work/stock-applets:$PATH"
              python3 tools/fw/test_d3_connectivity.py
            )
            python3 tests/test_d3_web.py
            C2M_REQUIRE_BROWSER_TEST=1 python3 tests/test_d3_web_browser.py
            python3 tests/test_d3_wifi_control.py
            python3 tools/fw/test_d3_mutation.py
            python3 tests/test_d3_gps.py
          ) > work/d3_build_tests.txt 2>&1
          trap - ERR
          cat work/d3_build_tests.txt
          # Explicit deployed D3 list; the decoder tests do not imply an optional
          # c2m-gps service. D4's dedicated producer below is mandatory instead.
          (
            cd work/d3-services
            sha256sum boot.sh connectivity_probe.sh c2m-web c2m-wifi wpa_supplicant
          ) > work/d3_services.sha256
          find fw/d3 -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' -o -name '*.sh' -o -name '*.py' \) \
            -print0 | sort -z | xargs -0 sha256sum > work/d3_source.sha256
          sha256sum tools/fw/test_d3_connectivity.py tests/test_d3_web.py \
            tests/test_d3_web_browser.py tests/test_d3_wifi_control.py \
            tools/fw/test_d3_mutation.py tests/test_d3_gps.py > work/d3_test_source.sha256
          cp work/d3-services/boot.sh work/d3_boot.sh
          cp work/d3-services/connectivity_probe.sh work/d3_connectivity_probe.sh
          cp fw/d3/build.sh work/d3_build.sh
      - name: Mandatory D4 producer stock-ABI/QEMU + host DB/advisory/web/mutator/browser gates (GATE)
        run: |
          trap 'cat work/d4_build_tests.txt' ERR
          (
            set -eu
            bash fw/d4/build.sh --out work/d4-services --sysroot work/sysroot
            # Keep recognized compiler intermediates PRIVATE and outside the
            # exact two-file deploy directory required by the D4 mutator.
            mkdir -p work/d4-build-private
            for file in objects d4_hashes.txt; do
              if [ -e "work/d4-services/$file" ]; then
                test ! -L "work/d4-services/$file"
                mv "work/d4-services/$file" "work/d4-build-private/$file"
              fi
            done
            python3 - <<'EOF'
          from pathlib import Path
          services = Path("work/d4-services")
          if services.is_symlink() or {p.name for p in services.iterdir()} != {"c2m-signs", "d4_boot.sh"}:
              raise SystemExit("D4-GATE: unexpected deploy output")
          for name in ("c2m-signs", "d4_boot.sh"):
              path = services / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("D4-GATE: missing/nonregular mandatory service")
          EOF
            test -x work/d4-services/c2m-signs
            test -x work/d4-services/d4_boot.sh
            cmp -s fw/d4/d4_boot.sh work/d4-services/d4_boot.sh
            python3 fw/device_minimal/check_elf.py work/d4-services/c2m-signs --allow-dynamic
            timeout 30 qemu-arm-static -L work/sysroot work/d4-services/c2m-signs --self-test
            export C2M_TEST_SYSROOT="$PWD/work/sysroot"
            "$PWD/work/stock-sh" -n work/d4-services/d4_boot.sh
            command -v node
            node --version
            python3 tests/test_d4_database.py
            python3 tests/test_d4_advisory.py
            python3 tests/test_d4_web.py
            python3 tools/fw/test_d4_mutation.py
            C2M_REQUIRE_BROWSER_TEST=1 python3 tests/test_d4_browser.py
            C2M_REQUIRE_BROWSER_TEST=1 python3 tests/test_d4_end_to_end.py
          ) > work/d4_build_tests.txt 2>&1
          trap - ERR
          cat work/d4_build_tests.txt
          sha256sum work/d4-services/c2m-signs work/d4-services/d4_boot.sh \
            work/d4-private/signs-d4.bin > work/d4_services.sha256
          find fw/d4 -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' -o -name '*.sh' -o -name '*.py' \) \
            -print0 | sort -z | xargs -0 sha256sum > work/d4_source.sha256
          sha256sum tests/test_d4_database.py tests/test_d4_advisory.py tests/test_d4_web.py \
            tools/fw/test_d4_mutation.py tests/test_d4_browser.py tests/test_d4_end_to_end.py \
            tools/fw/mutate_customer.py .github/workflows/firmware-candidateD4.yml > work/d4_test_source.sha256
          cp work/d4-services/d4_boot.sh work/d4_boot.sh
          cp fw/d4/build.sh work/d4_build.sh
          python3 - <<'EOF'
          import hashlib
          import json
          from pathlib import Path
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          database = json.loads(Path("work/d4_database.json").read_text())
          report = {
              "build_script_sha256": digest("work/d4_build.sh"),
              "boot_script_sha256": digest("work/d4_boot.sh"),
              "c2m_signs_sha256": digest("work/d4-services/c2m-signs"),
              "database_sha256": digest("work/d4-private/signs-d4.bin"),
              "database_count": database["count"],
          }
          if report["database_sha256"] != database["sha256"] or report["database_count"] != 12708:
              raise SystemExit("D4-GATE: database changed after pin validation")
          Path("work/d4_report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, sort_keys=True))
          EOF
      - name: P2 mutate exact C/D/D3 + isolated D4 assets/private DB and rebuild D4 (GATE)
        run: |
          python3 - > work/audio_map.json <<'EOF'
          import json
          pairs = [("LDW.wav", "vi_LDW.wav"), ("PCW.wav", "vi_PCW.wav"),
                   ("SAG.wav", "vi_SAG.wav"), ("VB.wav", "vi_VB.wav"),
                   ("adas_activated.wav", "vi_adas_activated.wav"),
                   ("adas_fail.wav", "vi_adas_fail.wav"),
                   ("updating.wav", "vi_updating.wav"),
                   ("tlr_green_on.wav", "tlr_green_on.wav")]
          print(json.dumps([{"path": "/minieye/adas/audios/" + img,
                             "file": "work/vi-audios/" + src}
                            for img, src in pairs], indent=2))
          EOF
          python3 tools/fw/mutate_customer.py --tree work/tree \
            --manifest work/customer_manifest.json \
            --idle-bin build/arm-dyn-b/c2m-idle \
            --audio-replacements work/audio_map.json \
            --tsr-experiment \
            --d3-services-dir work/d3-services \
            --d4-services-dir work/d4-services \
            --d4-database work/d4-private/signs-d4.bin \
            --d4-database-sha256 3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c \
            --out-manifest work/mutation_D4.json
          cmp -s build/arm-dyn-b/c2m-idle work/tree/c2m/c2m-idle
          cmp -s work/tsr_profile_boot.sh work/tree/c2m/tsr_profile_boot.sh
          for file in boot.sh connectivity_probe.sh c2m-web c2m-wifi wpa_supplicant; do
            cmp -s "work/d3-services/$file" "work/tree/c2m/$file"
          done
          cmp -s fw/d3/boot.sh work/tree/c2m/boot.sh
          for file in c2m-signs d4_boot.sh; do
            cmp -s "work/d4-services/$file" "work/tree/c2m/$file"
          done
          cmp -s work/d4-private/signs-d4.bin work/tree/c2m/signs-d4.bin
          python3 - <<'EOF'
          import json
          from pathlib import Path
          expected = {"c2m-idle", "tsr_profile_boot.sh", "boot.sh", "connectivity_probe.sh",
                      "c2m-web", "c2m-wifi", "wpa_supplicant", "c2m-signs", "d4_boot.sh", "signs-d4.bin"}
          deployed = Path("work/tree/c2m")
          if deployed.is_symlink() or {p.name for p in deployed.iterdir()} != expected:
              raise SystemExit("D4-GATE: installed service allowlist mismatch")
          for path in deployed.iterdir():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("D4-GATE: installed service must be regular")
          for item in json.loads(Path("work/audio_map.json").read_text()):
              if Path(item["file"]).read_bytes() != (Path("work/tree") / item["path"].lstrip("/")).read_bytes():
                  raise SystemExit("D4-GATE: unchanged C audio install mismatch")
          hook = Path("work/tree/wifi/rcInsDriver.sh").read_text()
          launches = ["/customer/c2m/c2m-idle >/dev/null 2>&1 &",
                      "/bin/sh /customer/c2m/boot.sh >/dev/null 2>&1 &",
                      "/bin/sh /customer/c2m/d4_boot.sh >/dev/null 2>&1 &"]
          if any(hook.count(line) != 1 for line in launches) or not (
                  hook.index(launches[0]) < hook.index(launches[1]) < hook.index(launches[2])):
              raise SystemExit("D4-GATE: separate detached idle/D3/D4 launch order mismatch")
          report = json.loads(Path("work/mutation_D4.json").read_text())
          database = json.loads(Path("work/d4_database.json").read_text())
          if report.get("d4_services") is not True or report.get("d4_database") != database:
              raise SystemExit("D4-GATE: mutation database hash/count mismatch")
          print("D4-GATE: exact installed C/D/D3/D4 assets and separate launch order verified")
          EOF
          sudo bash tools/fw/rebuild_customer.sh --mode mutated \
            --tree work/tree --tree-report work/tree_report.json \
            --geometry work/customer_geometry.json \
            --stock-manifest work/customer_manifest.json \
            --mut-manifest work/mutation_D4.json \
            --out work/customer_D4.es --report work/rebuild_D4.json
      - name: P3 assemble + deep validate + allowlist diff Candidate D4 (packtool B names; GATE)
        run: |
          python3 tools/fw/build_candidates.py \
            --en-tar firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar \
            --workdir work/candidates --customer-b work/customer_D4.es
          python3 - <<'EOF'
          import json
          from pathlib import Path
          for filename, expected in (("validate_A_deep.json", "VALID"),
                                     ("validate_B_deep.json", "VALID"),
                                     ("candidate_B_diff.json", "ALLOWLIST-OK")):
              verdict = json.loads((Path("work/candidates") / filename).read_text())["verdict"]
              if verdict != expected:
                  raise SystemExit(f"D4-GATE: {filename}: {verdict} != {expected}")
          print("D4-GATE: both deep validations VALID; protected-payload diff ALLOWLIST-OK")
          EOF
          sha256sum work/candidates/EN_ENHANCE_IDLE.tar work/candidates/EN_REPACK_GOLDEN.tar \
            > work/candidateD4_hashes.txt
      - name: Assemble private release layout (A + D4; stock token; NOT FLASH-READY)
        run: |
          R=release/c2m-flash
          mkdir -p "$R/C2M_FLASH_A" "$R/C2M_FLASH_D4" "$R/BUILD_EVIDENCE"
          cp work/candidates/EN_REPACK_GOLDEN.tar work/candidates/EN_ENHANCE_IDLE.tar "$R/"
          tar -C "$R/C2M_FLASH_A" -xf "$R/EN_REPACK_GOLDEN.tar"
          tar -C "$R/C2M_FLASH_D4" -xf "$R/EN_ENHANCE_IDLE.tar"
          test "$(ls "$R/C2M_FLASH_A" | sort | tr '\n' ' ')" = "SigmastarUpgradeSD_SSC8838G.bin adas_upgrade.sh minieye_firmware.md5 sysVer.txt "
          test "$(ls "$R/C2M_FLASH_D4" | sort | tr '\n' ' ')" = "SigmastarUpgradeSD_SSC8838G.bin adas_upgrade.sh minieye_firmware.md5 sysVer.txt "
          python3 - <<'EOF'
          from pathlib import Path
          import tarfile
          with tarfile.open("firmware/original/V2023.08.03.1_C2M_U_FR_WIFI_EN.tar") as package:
              stock_token = package.extractfile("sysVer.txt").read()
          members = {"SigmastarUpgradeSD_SSC8838G.bin", "adas_upgrade.sh", "minieye_firmware.md5", "sysVer.txt"}
          for folder in ("C2M_FLASH_A", "C2M_FLASH_D4"):
              directory = Path("release/c2m-flash") / folder
              if {p.name for p in directory.iterdir()} != members or any(
                      p.is_symlink() or not p.is_file() for p in directory.iterdir()):
                  raise SystemExit("D4-GATE: release must contain exactly four regular files")
              if (directory / "sysVer.txt").read_bytes() != stock_token:
                  raise SystemExit("D4-GATE: CI release must retain the exact stock token")
          print("D4-GATE: exact four-file A/D4 folders; stock-token bytes unchanged")
          EOF
          cp work/candidateD4_hashes.txt work/c2m_idle.sha256 work/qemu_bin.sha256 \
            work/qemu_out.txt work/mutation_D4.json work/audio_map.json work/tool_versions.txt \
            work/vi_audio_SHA256SUMS.txt work/tsr_experiment_tests.txt \
            work/tsr_stock_busybox_tests.txt work/tsr_profile_boot.sh work/tsr_profile_boot.sha256 \
            work/d3_build_tests.txt work/d3_services.sha256 work/d3_source.sha256 \
            work/d3_test_source.sha256 work/d3_supplicant_source.json \
            work/d3_boot.sh work/d3_connectivity_probe.sh work/d3_build.sh \
            work/d4_build_tests.txt work/d4_services.sha256 work/d4_source.sha256 \
            work/d4_test_source.sha256 work/d4_database.json work/d4_report.json \
            work/d4_boot.sh work/d4_build.sh "$R/BUILD_EVIDENCE/"
          mkdir -p "$R/OPEN_SOURCE"
          cp work/d3-upstream/wpa_supplicant-2.12.tar.gz work/d3-upstream/libnl-3.11.0.tar.gz \
            work/d3-services/wpa_supplicant.COPYING fw/d3/build_supplicant.sh fw/d3/compat.h \
            fw/device_minimal/start.S fw/d3/init_arrays.c "$R/OPEN_SOURCE/"
          # Preserve the same exact sources, recipe and relinkable LGPL libnl
          # objects. Private deliverable only, never public binary artifacts.
          tar -C work/d3-upstream -czf "$R/OPEN_SOURCE/supplicant-relink.tar.gz" \
            wpa_supplicant-2.12 libnl-3.11.0 nl start.S start.o init_arrays.o compat_prefix.h pkg-config-static
          cp work/customer_geometry.json work/customer_manifest.json work/tree_report.json \
            work/rebuild_noop.json work/rebuild_noop.compare.txt \
            work/rebuild_D4.json work/rebuild_D4.compare.txt work/rebuild_D4.bmanifest.json \
            "$R/BUILD_EVIDENCE/"
          cp work/candidates/EN_PACKAGE_CONTRACT_B.json work/candidates/EN_PACKAGE_CONTRACT_B.md \
            work/candidates/candidate_B_diff.json work/candidates/repack_A.json \
            work/candidates/validate_A_deep.json work/candidates/validate_A_deep.md \
            work/candidates/validate_B_deep.json work/candidates/validate_B_deep.md \
            "$R/BUILD_EVIDENCE/"
          # Exact PRIVATE package list; only this text hash manifest is public.
          (
            cd "$R"
            sha256sum EN_REPACK_GOLDEN.tar EN_ENHANCE_IDLE.tar \
              C2M_FLASH_A/SigmastarUpgradeSD_SSC8838G.bin C2M_FLASH_A/adas_upgrade.sh \
              C2M_FLASH_A/minieye_firmware.md5 C2M_FLASH_A/sysVer.txt \
              C2M_FLASH_D4/SigmastarUpgradeSD_SSC8838G.bin C2M_FLASH_D4/adas_upgrade.sh \
              C2M_FLASH_D4/minieye_firmware.md5 C2M_FLASH_D4/sysVer.txt > SHA256SUMS.txt
          )
          cat > "$R/FLASH_README.txt" <<'EOF'
          C2M CANDIDATE D4 — CI ASSEMBLY ONLY / NOT FLASH-READY / NOT FLASH-PROVEN.

          ### Private retrieval and separately authorized local preparation
          CI preserves the STOCK EN update token in both raw four-file folders.
          Never copy raw C2M_FLASH_D4/ to a card or assume updater acceptance.
          Verify retrieved hashes, then use tools/fw/reversion_sd_package.py
          with exact source-member SHA256 pins for fail-closed LOCAL version-only
          preparation. Token 20261015000001 is reserved locally, NOT minted,
          applied or selected by CI. Owner-approved installed D3.1 token
          20261014000006 must never be reused. Verify the local report, all four
          files and refreshed inner MD5; never hand-edit sysVer or mix folders.
          A is a stock-token reference, not an automatically usable rollback.
          EN_REPACK_GOLDEN.tar is A; EN_ENHANCE_IDLE.tar is D4 in THIS deliverable.
          Packtool reports retain their generic candidate-B filenames only.

          ### Current owner-approved D4 scope
          Preserve C's exact eight VI ADAS WAVs and minimal idle daemon, the
          checked experimental D TSR profile and D3 boot/connectivity services.
          The stock hook still preserves its exit status; detached bounded mount
          wait launches idle, D3 boot, then the SEPARATE /customer/c2m/d4_boot.sh.
          D3 boot is unchanged. Mandatory c2m-signs performs read-only GPS plus
          offline nearby-area computation using the pinned PRIVATE directional
          R.420/R.421 subset: 12708 records, SHA256
          3bcf871956c61484858bef783187319fa5f9ae0da0c214c2c14afb1d62de411c.
          There is no optional/stale c2m-gps substitute or online DB fetch.
          No source records, labels, private IDs or coordinates are public.

          ### /signs and phone/browser sound ONLY
          The AP-only :8099 /signs page shows an EXPERIMENTAL GPS/offline nearby
          area advisory, NOT camera-derived TSR or proof of road applicability.
          No numeric vehicle speed, numeric/current/legal speed limit, camera
          recognition or safety-ready claim is exposed. Missing, stale, invalid
          or unstable GPS/database/status clears the advisory; never retain a
          last-known warning as current. Status heartbeats stay in private /tmp.
          Sound is muted by default and opt-in after a user gesture, generated
          ONLY by the phone/browser. New events may beep once; no heartbeat
          replay or guaranteed background/locked-phone sound. Browser CI proves
          scheduling/presentation, not audible phone or camera hardware behavior.
          NO D4 playback through stock speaker, audio IPC/UART or ADAS paths.
          Existing C ADAS audio is unchanged; D4 adds no camera audio asset.

          ### Honest connectivity and TSR limits / preserve ADAS core
          D3 UI stays on the existing stock AP interface/address, not wildcard
          or STA-facing. Boot never auto-associates a STA or replaces the AP.
          Requests require real concurrent same-channel AP+STA evidence; absence
          means refusal, not AP-to-STA switching or proof of hardware absence.
          DHCP, STA association and Internet access are NOT proven or promised.
          Bluetooth is read-only presence inventory, not pairing/radio proof.
          Credentials/settings stay private. Synthetic/Chrome tests use only
          fixtures and loopback, never real credentials, GPS, device or card.
          Existing D TSR flags/profile are unchanged. Recognition, display,
          warning behavior, threshold units/choices and hardware boot remain
          UNVERIFIED; APPLIED_WAIT_STOCK_REDECODE is not recognition proof.
          No stock Warner/GPS/ADAS/cardv/camera/model/calibration/kernel/bootloader
          binary changes. Manifest/deep-validation/allowlist gates preserve the
          core outside the narrow C/D/D3/D4 additions and hook/audio changes.
          This is the STOCK FULL UPDATER, not a customer-only write; it may also
          write unchanged core partitions. Never substitute a custom flasher.
          OPEN_SOURCE retains supplicant/libnl sources, recipe and relink objects.

          ### Hardware validation is separate, never performed by this CI
          Only after verified local preparation follow FLASH_HW_CHECKLIST.md
          with stable power, known-good FAT32 media and a recovery plan. Check
          boot, camera/recording, ADAS/display, stock AP, reboot and diagnostics
          before supervised /signs tests; use only the complete locally prepared
          D4 folder. QEMU proves stock-userspace execution, not hardware. No CI
          card/device access, workflow-triggered update or token reversion occurs.
          Do not rely on TSR, GPS, nearby-area data, connectivity or beep for safety.
          EOF
          cat "$R/SHA256SUMS.txt"
      - name: Publish D4 release to private vault (firmware and DB bytes stay private)
        env:
          FIRMWARE_VAULT_PUSH_KEY: ${{ secrets.FIRMWARE_VAULT_PUSH_KEY }}
        run: |
          test -n "$FIRMWARE_VAULT_PUSH_KEY" || \
            { echo "FIRMWARE_VAULT_PUSH_KEY secret missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$FIRMWARE_VAULT_PUSH_KEY" > ~/.ssh/fw_vault_push
          chmod 600 ~/.ssh/fw_vault_push
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fw_vault_push -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:vunguyenbv175/c2m-firmware-vault.git /tmp/vault-out
          D="deliverables/$(date -u +%Y%m%d)-d4-r${GITHUB_RUN_ID}"
          echo "VAULT_DIR=$D" >> $GITHUB_ENV
          mkdir -p "/tmp/vault-out/$D"
          cp -r release/c2m-flash "/tmp/vault-out/$D/"
          cd /tmp/vault-out && git add "$D" \
            && git -c user.name=c2m-ci -c user.email=c2m-ci@local \
               commit -m "candidate D4 private flash deliverables ${D} (stock token; local preparation required)" \
            && git push origin main
          rm -rf /tmp/vault-out ~/.ssh/fw_vault_push
          echo "VAULT-DIR: $D"
