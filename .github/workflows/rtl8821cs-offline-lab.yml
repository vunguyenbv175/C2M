name: rtl8821cs-offline-lab
# EXPLICIT RESEARCH-BRANCH / MANUAL PUBLIC-SOURCE LAB. Never a camera release.
# No device access, secrets, firmware, private SDK, network association or module load.
# Upstream kernel + reconstructed config cannot establish vendor camera ABI.
"on":
  workflow_dispatch:
  push:
    branches: [lab/rtl8821cs-offline-20261018]
    paths:
      - .github/workflows/rtl8821cs-offline-lab.yml
      - tools/wifi/build_rtl8821cs_lab.sh
      - tools/wifi/rtl8821cs_lab.py
      - tools/wifi/rtl8821cs_profiles/**
      - tests/test_rtl8821cs_lab.py
      - tools/fw/module_abi_report.py
      - tools/fw/test_module_abi_report.py
      - tools/fw/module_storage_report.py
      - tools/fw/test_module_storage_report.py
concurrency:
  group: rtl8821cs-offline-lab
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  public-source-module-lab:
    if: github.ref_name == 'lab/rtl8821cs-offline-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install public host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3-pyelftools
      - name: Offline lab source tests
        run: |
          bash -n tools/wifi/build_rtl8821cs_lab.sh
          python3 tests/test_rtl8821cs_lab.py
          python3 tools/fw/test_module_abi_report.py
          python3 tools/fw/test_module_storage_report.py
          python3 tests/test_d3_dhcp_lease.py
          python3 fw/diag/test_diag_contract.py
      - name: Build research baseline, legacy-WEXT and concurrent variants
        run: |
          bash tools/wifi/build_rtl8821cs_lab.sh "$RUNNER_TEMP/c2m-rtl-lab"
      - name: Validate bounded metadata evidence
        id: evidence
        if: always()
        env:
          LAB_DIR: ${{ runner.temp }}/c2m-rtl-lab
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['LAB_DIR'])
          report = root / 'report.json'
          if not report.is_file():
              raise SystemExit('No build report; inspect failed preparation step')
          data = json.loads(report.read_text())
          assert data.get('load_safety') == 'NOT_ESTABLISHED', 'report must disclaim load safety'
          assert data['identity']['load_authorized'] is False
          assert data['identity']['load_policy'] == 'NO_LOAD_EVER_FROM_THIS_LAB'
          if data.get('status') == 'ok':
              experiment = data.get('wext_experiment') or {}
              print('wext_experiment section delta (wext - baseline):', experiment.get('section_delta_wext_minus_baseline'))
              print('wext_experiment undefined add/remove:', experiment.get('undefined_symbols_added'), experiment.get('undefined_symbols_removed'))
              print('wext_experiment rtw_handlers_def:', experiment.get('rtw_handlers_def'))
              print('wext_experiment stock .text gap remaining bytes:', experiment.get('stock_text_gap_remaining_bytes'))
              for profile in ['baseline', 'wext', 'concurrent']:
                  assert (root / (profile + '.metadata.json')).is_file()
                  assert (root / (profile + '.storage.json')).is_file()
                  assert (root / (profile + '.memzero-attribution.json')).is_file()
              assert (root / 'memzero-probe.json').is_file()
              assert (root / 'layout-probe-wext.json').is_file()
              wext_storage = json.loads((root / 'wext.storage.json').read_text())
              assert not wext_storage.get('bounds', {}).get('truncated'), 'wext storage table unexpectedly truncated'
              handlers = [obj for obj in wext_storage.get('objects', []) if obj.get('name') == 'rtw_handlers_def']
              assert len(handlers) == 1, 'wext profile must emit exactly one rtw_handlers_def object (saw %d)' % len(handlers)
              assert handlers[0].get('size') == 24, 'wext rtw_handlers_def must be 24 bytes (saw %r)' % handlers[0].get('size')
              assert experiment.get('rtw_handlers_def', {}).get('present') is True, 'report must record the wext rtw_handlers_def'
          for name in ['report.json', 'baseline.metadata.json', 'wext.metadata.json', 'concurrent.metadata.json', 'build-baseline.log', 'build-wext.log', 'build-concurrent.log', 'kernel-prepare.log', 'toolchain.txt', 'layout-probe.json', 'layout-probe.log', 'layout-probe-wext.json', 'layout-probe-wext.log', 'baseline.storage.json', 'wext.storage.json', 'concurrent.storage.json', 'memzero-probe.json', 'memzero-probe.log', 'baseline.memzero-attribution.json', 'wext.memzero-attribution.json', 'concurrent.memzero-attribution.json']:
              p = root / name
              if p.exists():
                  assert p.is_file() and not p.is_symlink(), name
                  assert p.stat().st_size <= 16 * 1024 * 1024, name + ' exceeds evidence cap'
                  if p.suffix == '.json':
                      json.loads(p.read_text())
          PY
      - name: Preserve metadata only, never modules or source trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8821cs-offline-lab-metadata
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/c2m-rtl-lab/report.json
            ${{ runner.temp }}/c2m-rtl-lab/baseline.metadata.json
            ${{ runner.temp }}/c2m-rtl-lab/wext.metadata.json
            ${{ runner.temp }}/c2m-rtl-lab/concurrent.metadata.json
            ${{ runner.temp }}/c2m-rtl-lab/build-baseline.log
            ${{ runner.temp }}/c2m-rtl-lab/build-wext.log
            ${{ runner.temp }}/c2m-rtl-lab/build-concurrent.log
            ${{ runner.temp }}/c2m-rtl-lab/kernel-prepare.log
            ${{ runner.temp }}/c2m-rtl-lab/toolchain.txt
            ${{ runner.temp }}/c2m-rtl-lab/layout-probe.json
            ${{ runner.temp }}/c2m-rtl-lab/layout-probe.log
            ${{ runner.temp }}/c2m-rtl-lab/layout-probe-wext.json
            ${{ runner.temp }}/c2m-rtl-lab/layout-probe-wext.log
            ${{ runner.temp }}/c2m-rtl-lab/baseline.storage.json
            ${{ runner.temp }}/c2m-rtl-lab/wext.storage.json
            ${{ runner.temp }}/c2m-rtl-lab/concurrent.storage.json
            ${{ runner.temp }}/c2m-rtl-lab/memzero-probe.json
            ${{ runner.temp }}/c2m-rtl-lab/memzero-probe.log
            ${{ runner.temp }}/c2m-rtl-lab/baseline.memzero-attribution.json
            ${{ runner.temp }}/c2m-rtl-lab/wext.memzero-attribution.json
            ${{ runner.temp }}/c2m-rtl-lab/concurrent.memzero-attribution.json
