name: c2m-ci
# Product CI — must pass on a clean checkout with NO firmware artifacts.
# Firmware-evidence verification lives in firmware-evidence.yml (manual).
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Warner native build + hostile-input guards (no device access)
        run: |
          cmake -S fw/warner -B build/warner-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/warner-native
          ctest --test-dir build/warner-native --output-on-failure
          python3 fw/warner/tools/test_signs_tools.py
          python3 fw/warner/tools/build_signs_bin.py --demo build/warner-native/signs.bin
          python3 - <<'PY'
          from pathlib import Path
          payload = 'GPRMC,084522,A,1046.32,N,10641.49,E,21.6,90.0,141026,,,A'
          checksum = 0
          for char in payload:
              checksum ^= ord(char)
          Path('build/warner-native/replay.nmea').write_text('$' + payload + '*%02X\n' % checksum)
          PY
          timeout 5 build/warner-native/c2m-warner --replay build/warner-native/replay.nmea \
            -s build/warner-native/signs.bin > build/warner-native/replay.txt
          grep -q 'SIMULATION ALERT' build/warner-native/replay.txt
      - name: Standalone header checks
        run: |
          for h in $(find include -name '*.hpp'); do
            echo "== $h"
            g++ -std=c++17 -fsyntax-only -I include -x c++ "$h"
          done
      - name: Python tests (no firmware needed)
        run: |
          pip install msgpack websocket-client 2>/dev/null || pip3 install msgpack websocket-client
          python3 tools/m4/test_protocol.py
          python3 tools/m4/test_capture_tsr_readonly.py
          python3 tools/m4/test_normalize_adas.py
          python3 tools/m4/test_m4_policy.py
          python3 tools/m4/make_fixture.py
          python3 tools/m4/test_real_data_path.py
          python3 tools/road/osm_preprocess.py --out /tmp/roads_ci.sqlite
          python3 tools/road/test_road.py
          python3 tests/test_firmware_pipeline.py
          python3 fw/device_minimal/test_check_elf.py
          python3 fw/device_minimal/test_startup_abi.py
          python3 fw/device_minimal/test_sdlog.py
          python3 tests/test_candidate_b.py
          python3 tools/fw/test_tsr_profile.py
          python3 tools/fw/test_tsr_experiment.py
          python3 tools/fw/test_reversion_sd_package.py
  arm-minimal:
    # Reproducible cross-build of the MINIMAL idle binary (static analysis only).
    # Label: HOST-CROSS-BUILT, NOT device-tested. No firmware needed.
    # Toolchain is runner-pinned (ubuntu-24.04 image) with the exact compiler
    # version recorded to build/arm-minimal/toolchain_version.txt; the apt
    # package itself is NOT version-pinned (see TARGET_ABI.md §3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain + Ninja
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf ninja-build
          arm-linux-gnueabihf-gcc --version
          ninja --version
      - name: Build minimal ARM binary (static)
        run: |
          cmake -S "${{ github.workspace }}/fw/device_minimal" -B build/arm-minimal \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/fw/device_minimal/toolchain-armhf.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/arm-minimal --verbose
          arm-linux-gnueabihf-gcc --version > build/arm-minimal/toolchain_version.txt
          dpkg-query -W gcc-arm-linux-gnueabihf libc6-dev-armhf-cross >> build/arm-minimal/toolchain_version.txt
          ls -l build/arm-minimal/c2m-idle
      - name: ELF gate (static ARMv7-A hard-float VFPv3-D16, TU proven NEON-free)
        run: |
          arm-linux-gnueabihf-gcc -march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16 -Os -Wall -Wextra \
            -c fw/device_minimal/c2m_idle.c -o build/arm-minimal/c2m_idle_check.o
          python3 fw/device_minimal/check_elf.py build/arm-minimal/c2m-idle \
            --object build/arm-minimal/c2m_idle_check.o --allow-libc-simd
  arm-dyn:
    # P0 preferred path: dynamic binary pinned to the stock glibc 2.30 ABI.
    # No firmware needed: glibc_compat.h pins every reachable symbol version
    # and check_elf.py --allow-dynamic independently proves max need <= 2.30.
    # Label: HOST-CROSS-BUILT, NOT device-tested.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain + Ninja
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf ninja-build
          arm-linux-gnueabihf-gcc --version
      - name: Build dynamic ARM binary (stock-loader compatible)
        run: |
          cmake -S "${{ github.workspace }}/fw/device_minimal" -B build/arm-dyn \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/fw/device_minimal/toolchain-armhf-dyn.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/arm-dyn --verbose
          arm-linux-gnueabihf-gcc --version > build/arm-dyn/toolchain_version.txt
      - name: Startup disassembly evidence (_start contract)
        run: |
          arm-linux-gnueabihf-gcc -march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16 -Os -Wall -Wextra \
            -include fw/device_minimal/glibc_compat.h \
            -c fw/device_minimal/start.S -o build/arm-dyn/start_check.o
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o | grep -q "bl.*__libc_start_main"
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o | grep -q "pop"
          arm-linux-gnueabihf-readelf -S build/arm-dyn/start_check.o | grep -q "note.GNU-stack"
      - name: Startup disassembly evidence (_start contract)
        run: |
          arm-linux-gnueabihf-gcc -march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16 -Os -Wall -Wextra \
            -include fw/device_minimal/glibc_compat.h \
            -c fw/device_minimal/start.S -o build/arm-dyn/start_check.o
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o | grep -q "bl.*__libc_start_main"
          arm-linux-gnueabihf-objdump -d build/arm-dyn/start_check.o | grep -q "pop"
          arm-linux-gnueabihf-readelf -S build/arm-dyn/start_check.o | grep -q "note.GNU-stack"
      - name: ELF gate (dynamic, interp + NEEDED + GLIBC<=2.30 + VFPv3-D16, no SIMD)
        run: python3 fw/device_minimal/check_elf.py build/arm-dyn/c2m-idle --allow-dynamic
