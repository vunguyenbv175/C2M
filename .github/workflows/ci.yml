name: c2m-ci
# Product CI — must pass on a clean checkout with NO firmware artifacts.
# Firmware-evidence verification lives in firmware-evidence.yml (manual).
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Standalone header checks
        run: |
          for h in $(find include -name '*.hpp'); do
            echo "== $h"
            g++ -std=c++17 -fsyntax-only -I include -x c++ "$h"
          done
      - name: Python tests (no firmware needed)
        run: |
          pip install msgpack websocket-client 2>/dev/null || pip3 install msgpack websocket-client
          python3 tools/m4/test_protocol.py
          python3 tools/m4/test_normalize_adas.py
          python3 tools/m4/test_m4_policy.py
          python3 tools/m4/make_fixture.py
          python3 tools/m4/test_real_data_path.py
          python3 tools/road/osm_preprocess.py --out /tmp/roads_ci.sqlite
          python3 tools/road/test_road.py
          python3 tests/test_firmware_pipeline.py
  arm-minimal:
    # Reproducible cross-build of the MINIMAL idle binary (static analysis only).
    # Label: HOST-CROSS-BUILT, NOT device-tested. No firmware needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain (pinned runner image provides version; logged below)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf cmake
          arm-linux-gnueabihf-gcc --version
      - name: Build minimal ARM binary
        run: |
          cmake -S fw/device_minimal -B build/arm-minimal \
            -DCMAKE_TOOLCHAIN_FILE=fw/device_minimal/toolchain-armhf.cmake \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/arm-minimal --verbose
          arm-linux-gnueabihf-gcc --version > build/arm-minimal/toolchain_version.txt
      - name: ELF gate (32-bit LE ARM EXEC)
        run: python3 fw/device_minimal/check_elf.py build/arm-minimal/c2m-idle
